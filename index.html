        (function () {
            var scripts = [

                'js/pages/contact.js',
                'js/pages/home.js',
                'js/views.js',
                'js/router.js',
                'js/app.js'
            ];

            function loadAssets(v) {
                document.head.insertAdjacentHTML('beforeend',
                    '<link rel="stylesheet" href="css/styles.css?v=' + v + '">');

                function loadNext(i) {
                    if (i >= scripts.length) return;
                    var el = document.createElement('script');
                    el.src = scripts[i] + '?v=' + v;
                    el.onload = function () { loadNext(i + 1); };
                    document.body.appendChild(el);
                }
                loadNext(0);
            }

            fetch('data/version.json', { cache: 'no-cache' })
                .then(function (r) { return r.json(); })
                .then(function (data) { loadAssets(data.version); })
                .catch(function () { loadAssets('1'); });
        })();
    </script>
