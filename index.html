<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <link rel="icon" type="image/png" href="assets/logos/fav-icon1.png">
    <title>Ravi Kumar Gupta</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script>
        (function () {
            var saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-bs-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        document.head.insertAdjacentHTML('beforeend',
            '<link rel="stylesheet" href="css/styles.css?v=' + Date.now() + '">');
    </script>

</head>

<body>

    <!-- ============================= -->
<!-- Navigation                    -->
<!-- ============================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm fixed-top">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3 d-flex align-items-center" href="#">
            <img src="assets/images/profile.png"
                alt="Ravi Kumar Gupta"
                class="navbar-profile">
            <span>Ravi Kumar Gupta</span>
        </a>
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <button id="themeToggle" class="btn btn-link nav-link px-2 ms-2" title="Toggle theme">
            <i id="themeIcon" class="bi bi-sun-fill fs-5"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">

            <ul class="navbar-nav ms-auto" id="topNavigation">

                <!-- Navigation will be generated dynamically -->

            </ul>

        </div>

    </div>

</nav>



    <!-- ============================= -->
    <!-- Main Content                  -->
    <!-- ============================= -->

    <main id="content"
          class="container"
          style="margin-top:90px; min-height:80vh;">

        <!-- View will be loaded here -->
        This is the main content area. The content of the selected view will be loaded here dynamically.
    </main>



    <!-- ============================= -->
    <!-- Footer                        -->
    <!-- ============================= -->

    <footer class="bg-dark border-top mt-5">

        <div class="container py-4">

            <div class="row">

                <div class="col-md-6">

                    <h5>Ravi Kumar Gupta</h5>

                    <p class="text-secondary">

                        AI Research • Enterprise AI • Data Science

                    </p>

                </div>

                <div class="col-md-6 text-md-end">
                    <a class="social-link" href="https://github.com/rgravigupta91" target="_blank">
                        <span class="bi bi-github"> GitHub</span>
                    </a>&nbsp;&nbsp;|&nbsp;&nbsp;   
                    
                    <a href="https://www.linkedin.com/in/rgravigupta91/" class="social-link" target="_blank">
                        <span class="bi bi-linkedin"> LinkedIn</span>
                    </a>&nbsp;&nbsp;|&nbsp;&nbsp;   

                    <a href="#"
                        class="social-link footer-nav"
                        data-url="/contact">
                            Contact
                    </a>

                </div>

            </div>

        </div>

    </footer>





    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var v = Date.now();
            var scripts = [
                'js/utils.js',
                'js/config.js',
                'js/navigation.js',
                'js/initialization.js',
                'js/pages/contact.js',
                'js/pages/home.js',
                'js/views.js',
                'js/router.js',
                'js/app.js'
            ];
            function loadNext(i) {
                if (i >= scripts.length) return;
                var el = document.createElement('script');
                el.src = scripts[i] + '?v=' + v;
                el.onload = function () { loadNext(i + 1); };
                document.body.appendChild(el);
            }
            loadNext(0);
        })();
    </script>

</body>
 
</html>
