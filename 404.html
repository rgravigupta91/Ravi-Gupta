<script>

const segments =
    window.location.pathname
        .split("/")
        .filter(Boolean);

const basePath =
    segments.length > 0
        ? `/${segments[0]}/`
        : "/";

const route =
    segments.length > 1
        ? "/" + segments.slice(1).join("/")
        : "/";

window.location.replace(
    basePath +
    "?route=" +
    encodeURIComponent(route)
);

</script>
